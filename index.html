 uchun',steps:[['0–5 daq','Bankka qo‘ng‘iroq qiling','Kartaning orqasidagi yoki ilovadagi raqam orqali. Ayting: «Men firibgarlik qurbonman, kartani bloklashni va amallarni to‘xtatishni so‘rayman».'],['5–10 daq','Karta va onlayn-bankni bloklang','Bank ilovasi yoki telefon orqali. Kartani qayta chiqarishni so‘rang.'],['10–20 daq','Parollarni almashtiring','Bank, pochta, Telegram, Payme va Click. Ikki bosqichli tekshiruvni yoqing va begona seanslarni tugating.'],['20–30 daq','O‘rnatilgan ilovani olib tashlang','AnyDesk yoki shunga o‘xshash ilova o‘rnatilgan bo‘lsa: internetni o‘chiring, dasturni o‘chiring, imkon bo‘lsa telefonni qayta tiklang.'],['30–45 daq','Dalillarni saqlang','Yozishma skrinshotlari, jo‘natuvchi raqami, cheklar, oluvchi rekvizitlari. Hech narsani o‘chirmang.'],['45–60 daq','Ariza bering','102 ga qo‘ng‘iroq qiling yoki eng yaqin bo‘limga boring. Vaqt, summa va oluvchi rekvizitlarini ayting.']],bankT:'Assalomu alaykum. Men firibgarlik qurbonman. Karta: ****[oxirgi 4 raqam]. Summa: [summa] so‘m, vaqt: [vaqt], oluvchi: [karta/telefon]. Kartani bloklashingizni, amalni to‘xtatish yoki bahslashishingizni va murojaatni ro‘yxatga olishingizni so‘rayman. Murojaat raqamini ayting.',polT:'Firibgarlik haqida ariza qabul qilishingizni so‘rayman. [Sana, vaqt]: menga [raqam] raqamidan qo‘ng‘iroq qilishdi/yozishdi va o‘zlarini [kim] deb tanishtirishdi. Aldov ta‘sirida men [pul o‘tkazdim/kodni aytdim], summa: [summa] so‘m, oluvchi: [rekvizitlar]. Arizaga skrinshot va cheklarni ilova qilaman. F.I.Sh., telefon: [ma‘lumot].'}};

const SIM={ru:[{t:'📞 Звонок «из службы безопасности банка»',st:[{m:'Здравствуйте, служба безопасности банка. По вашей карте идёт списание 3 000 000 сум. Чтобы отменить, назовите код из SMS.',c:[['Называю код, чтобы отменить списание',0,'Код из SMS подтверждает операцию, а не отменяет её. Банк его не спрашивает.'],['Говорю, что перезвоню по номеру на карте, и завершаю звонок',1,'Верно. Прервите разговор и наберите банк сами.'],['Прошу назвать имя и табельный номер',0,'Мошенник назовёт любое имя. Проверка «на словах» не работает.']]},{m:'Не бросайте трубку, времени мало! Тогда установите приложение AnyDesk, мы сами отменим операцию.',c:[['Устанавливаю, ведь это быстрее',0,'AnyDesk даёт полный доступ к телефону и банковским приложениям.'],['Отказываюсь и кладу трубку',1,'Верно. Сотрудники банка не просят ставить программы удалённого доступа.'],['Устанавливаю, но коды не называю',0,'С доступом к экрану мошенник сам увидит коды и проведёт операции.']]},{m:'Тогда переведите деньги на «безопасный счёт», это защитит их от кражи.',c:[['Перевожу, раз это безопасный счёт',0,'«Безопасных счетов» не существует. Это перевод мошеннику.'],['Не перевожу, звоню в банк по официальному номеру',1,'Верно. Звонок в банк по номеру с карты решает вопрос за минуту.'],['Перевожу половину суммы',0,'Половина суммы всё равно потеряна.']]}]},{t:'💬 «Мама, я потерял телефон» в Telegram',st:[{m:'Мам, это я с нового номера, старый телефон потерял. Срочно нужно оплатить штраф, переведи 1 500 000 сум на эту карту.',c:[['Перевожу, ведь сын просит',0,'Смена номера плюс срочность и деньги — классика обмана.'],['Звоню сыну на старый номер или его друзьям',1,'Верно. Свяжитесь с человеком по каналу, который у вас уже был.'],['Прошу прислать фото',0,'Фото легко украсть или сгенерировать.']]},{m:'Позвонить не могу, нет связи. Пожалуйста, быстрее, это очень важно.',c:[['Спрашиваю кодовое слово',1,'Верно. Кодовое слово знаете только вы с близкими.'],['Перевожу часть суммы',0,'Часть суммы тоже теряется.'],['Прошу номер карты и перевожу',0,'Чужая карта может принадлежать мошеннику. Это не проверка.']]},{m:'Какое слово? Не до этого! Я же твой сын, переводи срочно!',c:[['Перевожу, нервничаю за него',0,'Уход от кодового слова — признак обмана.'],['Прекращаю переписку и звоню родным',1,'Верно. Отказ ответить на проверку разоблачает мошенника.'],['Пишу ему, что переведу позже',0,'Лучше прекратить разговор и связаться с сыном другим способом.']]}]}],uz:[{t:'📞 «Bank xavfsizlik xizmati»dan qo‘ng‘iroq',st:[{m:'Assalomu alaykum, bank xavfsizlik xizmati. Kartangizdan 3 000 000 so‘m yechilmoqda. Bekor qilish uchun SMS kodni ayting.',c:[['Bekor qilish uchun kodni aytaman',0,'SMS kod amalni tasdiqlaydi, bekor qilmaydi. Bank uni so‘ramaydi.'],['Kartadagi raqamga o‘zim qayta qo‘ng‘iroq qilaman, deb gapni tugataman',1,'To‘g‘ri. Suhbatni uzing va bankka o‘zingiz qo‘ng‘iroq qiling.'],['Ismi va tabel raqamini so‘rayman',0,'Firibgar istalgan ismni aytadi. «Og‘zaki» tekshiruv ishlamaydi.']]},{m:'Go‘shakni qo‘ymang, vaqt oz! Unda AnyDesk ilovasini o‘rnating, amalni o‘zimiz bekor qilamiz.',c:[['O‘rnataman, bu tezroq',0,'AnyDesk telefon va bank ilovalariga to‘liq kirish beradi.'],['Rad etaman va go‘shakni qo‘yaman',1,'To‘g‘ri. Bank xodimlari masofaviy kirish dasturini o‘rnatishni so‘ramaydi.'],['O‘rnataman, lekin kodlarni aytmayman',0,'Ekranga kirish bilan firibgar kodlarni o‘zi ko‘radi.']]},{m:'Unda pulni «xavfsiz hisob»ga o‘tkazing, bu uni o‘g‘irlikdan asraydi.',c:[['«Xavfsiz hisob» bo‘lgani uchun o‘tkazaman',0,'«Xavfsiz hisob» degan narsa yo‘q. Bu firibgarga o‘tkazma.'],['O‘tkazmayman, bankka rasmiy raqam orqali qo‘ng‘iroq qilaman',1,'To‘g‘ri. Kartadagi raqamga qo‘ng‘iroq bir daqiqada hal qiladi.'],['Yarmini o‘tkazaman',0,'Yarmi baribir yo‘qoladi.']]}]},{t:'💬 Telegramda «Ona, telefonimni yo‘qotdim»',st:[{m:'Ona, bu men yangi raqamdan, eski telefonni yo‘qotdim. Shoshilinch jarima to‘lash kerak, shu kartaga 1 500 000 so‘m o‘tkazing.',c:[['O‘g‘lim so‘rayapti, o‘tkazaman',0,'Raqam almashgani, shoshilinchlik va pul so‘rovi — aldovning klassikasi.'],['O‘g‘limning eski raqamiga yoki do‘stlariga qo‘ng‘iroq qilaman',1,'To‘g‘ri. Odam bilan avvalgi kanal orqali bog‘laning.'],['Rasm yuborishni so‘rayman',0,'Rasmni o‘g‘irlash yoki yaratish oson.']]},{m:'Qo‘ng‘iroq qila olmayman, aloqa yo‘q. Iltimos, tezroq, juda muhim.',c:[['Kod so‘zni so‘rayman',1,'To‘g‘ri. Kod so‘zni faqat siz va yaqinlaringiz bilasiz.'],['Summaning bir qismini o‘tkazaman',0,'Bir qismi ham yo‘qoladi.'],['Karta raqamini so‘rab, o‘tkazaman',0,'Begona karta firibgarniki bo‘lishi mumkin. Bu tekshiruv emas.']]},{m:'Qanday so‘z? Hozir u gap emas! Men sening o‘g‘lingman, tez o‘tkaz!',c:[['Xavotirda o‘tkazaman',0,'Kod so‘zdan qochish aldov belgisi.'],['Yozishmani to‘xtatib, yaqinlarimga qo‘ng‘iroq qilaman',1,'To‘g‘ri. Tekshiruvga javob bermaslik firibgarni fosh qiladi.'],['Keyinroq o‘tkazaman, deb yozaman',0,'Suhbatni to‘xtatib, o‘g‘il bilan boshqa yo‘l orqali bog‘lanish yaxshiroq.']]}]}]};

family:()=>{const p=familyGet();return `${back()}<h1>👨‍👩‍👧‍👦 FiribStop Family</h1><p class="mu">Семейная защита от мошенничества: доверенные контакты, кодовое слово и быстрая проверка подозрительных просьб. Данные профиля сохраняются только на этом устройстве.</p>
<div class="card hero"><div style="font-size:36px">🛡️</div><div><h2>Правило семьи: остановись → проверь → перезвони</h2><p class="mu">Срочная просьба о деньгах от «ребёнка», «банка» или «службы поддержки» всегда требует проверки по независимому каналу.</p></div></div>
<div class="card"><h2>1. Контакты доверия</h2><div class="cloud-form"><label>Имя члена семьи<input id="family-person" type="text" maxlength="70" placeholder="Например, мама" value="${esc(p.personName||'')}"></label><label>Кто он для вас<input id="family-relation" type="text" maxlength="60" placeholder="Родитель / ребёнок / близкий" value="${esc(p.relation||'')}"></label><label>Доверенный контакт №1 — имя<input id="family-c1n" type="text" maxlength="70" value="${esc(p.contact1Name||'')}"></label><label>Телефон №1<input id="family-c1p" type="tel" maxlength="32" placeholder="+998 …" value="${esc(p.contact1Phone||'')}"></label><label>Доверенный контакт №2 — имя<input id="family-c2n" type="text" maxlength="70" value="${esc(p.contact2Name||'')}"></label><label>Телефон №2<input id="family-c2p" type="tel" maxlength="32" placeholder="+998 …" value="${esc(p.contact2Phone||'')}"></label><button class="btn p" onclick="saveFamilyProfile()">💾 Сохранить профиль</button><p class="mu">Номер телефона хранится локально. Не указывайте чужие номера без согласия владельца.</p></div></div>
<div class="card"><h2>2. Семейное кодовое слово</h2><p>Придумайте слово, которое знают только близкие. При неожиданной просьбе о деньгах спросите его и дополнительно перезвоните по сохранённому номеру.</p><label>Ваше кодовое слово<input id="family-code" type="password" maxlength="40" autocomplete="off" placeholder="Не используйте PIN или пароль" value="${esc(p.codeWord||'')}"></label><div class="row"><button class="btn" onclick="toggleFamilyCode()">👁️ Показать / скрыть</button><button class="btn" onclick="saveFamilyProfile()">Сохранить слово</button></div><p class="mu">Это слово не отправляется при анализе сообщений. Не используйте банковские пароли, PIN или коды восстановления.</p></div>
<div class="card"><h2>3. Проверьте подозрительную просьбу</h2><p class="mu">Вставьте сообщение, где родственник срочно просит деньги, код или установить приложение. Текст анализируется существующим движком FiribStop.</p><textarea id="family-message-input" maxlength="2000" placeholder="Например: Мама, срочно переведи деньги на новую карту…"></textarea><button class="btn p" onclick="familyCheckRequest()">🔍 Проверить сообщение</button><button class="btn" onclick="go('check')">Открыть полный анализатор</button></div>
<div class="card"><h2>4. Быстро связаться</h2>${familyContactButton(p.contact1Name,p.contact1Phone)}${familyContactButton(p.contact2Name,p.contact2Phone)}<button class="btn" onclick="shareFamilySafetyPlan()">📨 Отправить близким памятку безопасности</button><button class="btn" onclick="go('emer')">🆘 Экстренная помощь</button></div>
<div class="card"><h2>5. Семейная памятка</h2><ol><li>Никогда не сообщайте SMS/OTP-коды, PIN и CVV.</li><li>Перепроверяйте новую просьбу о деньгах звонком на старый номер.</li><li>Не устанавливайте APK или приложения удалённого доступа по просьбе звонящего.</li><li>При подозрении остановите платёж, сохраните скриншоты и свяжитесь с банком через официальный канал.</li></ol><button class="btn" onclick="copySafetyMemo()">📋 Скопировать памятку</button></div>`},
ai:()=>`${back()}<h1>🛡️ FiribStop Live Protection</h1><p class="mu">Без ИИ: локальные правила + интернет-база известных фишинговых ссылок.</p>
<div class="card"><h2>Настройка сервера</h2><p>Для Android APK укажите HTTPS-адрес запущенного FiribStop backend. В браузере на том же домене поле можно оставить пустым.</p><label for="apiBase"><b>Адрес сервера</b></label><input id="apiBase" type="url" placeholder="https://ваш-домен" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)"><button class="btn" onclick="saveApiBase()">Сохранить адрес</button><p class="mu">Не вводите сюда API-ключи. Для публичного сервера используйте HTTPS.</p></div>
<div class="card"><h2>1. Проверить ссылку</h2><p>Вставьте ссылку или передайте её сюда из другого приложения через «Поделиться» / «Открыть с помощью FiribStop».</p><label for="liveUrl">Ссылка</label><input id="liveUrl" type="url" inputmode="url" maxlength="2048" placeholder="https://example.com" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)"><div class="row"><button class="btn p" onclick="checkLiveUrl()">🔎 Проверить по базе угроз</button><button class="btn" onclick="clearLiveCheck()">Очистить</button></div><div id="urlCheckStatus" class="status-note" aria-live="polite">Проверка подключается к серверу и сверяет ссылку с лентой OpenPhish и локальными правилами.</div><div id="urlCheckResult"></div></div>
<div class="card"><h2>2. Проверить сообщение</h2><p>Вставьте подозрительный SMS или текст. Он проверяется правилами без отправки ИИ-провайдеру.</p><textarea id="liveText" maxlength="6000" oninput="liveTextPreview()" placeholder="Вставьте сообщение или текст просьбы…"></textarea><div id="textLiveStatus" class="status-note" aria-live="polite">Текст не отправляется на ИИ. Для проверки ссылок нажмите кнопку выше.</div><div class="row"><button class="btn p" onclick="checkLiveText()">Проверить текст</button><button class="btn" onclick="pickApkNative()">📦 Проверить APK</button></div><div id="textCheckResult"></div></div>
<div class="card"><h2>3. Статус интернет-базы</h2><p>Используется OpenPhish Community Feed — список известных фишинговых URL. Отсутствие совпадения не доказывает безопасность ссылки.</p><button class="btn" onclick="refreshThreatStatus()">Обновить статус базы</button><div id="threatStatus" class="status-note">Статус базы будет загружен по запросу.</div></div>

async function ocrImage(input){const file=input?.files?.[0];if(!file)return;const status=document.getElementById('ocrstatus');try{if(status)status.textContent='Загрузка OCR…';if(!window.Tesseract)await new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';x.onload=ok;x.onerror=()=>no(Error('Не удалось загрузить OCR. Проверьте интернет.'));document.head.appendChild(x)});if(status)status.textContent='Распознавание…';const worker=await Tesseract.createWorker('uzb+rus+eng');const r=await worker.recognize(file);await worker.terminate();if(!r.data.text.trim())throw Error('Текст не распознан; попробуйте более чёткий скриншот.');document.getElementById('ta').value=r.data.text.trim();if(status)status.textContent='Готово. Проверьте текст и нажмите «Проверить».'}catch(e){if(status)status.textContent=e.message||'Ошибка OCR'}}

async function scanApkFile(input){
 const file=input?.files?.[0];if(!file)return;const status=document.getElementById('apkScanResult');if(status)status.innerHTML='<div class="status-note">Выполняется локальная проверка APK…</div>';
 const findings=[];let level='low',entries=[],hash='';
 try{
  if(file.size>120*1024*1024)throw new Error('Файл больше 120 МБ. Используйте меньший файл или системный сканер Android.');
  const buf=await file.arrayBuffer(),u=new Uint8Array(buf),dv=new DataView(buf);
  try{if(crypto?.subtle){const h=await crypto.subtle.digest('SHA-256',buf);hash=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(_){ }
  let eocd=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('Не найдена ZIP-структура. Файл может быть повреждён или не является APK.');
  const count=dv.getUint16(eocd+10,true),cdOffset=dv.getUint32(eocd+16,true);let off=cdOffset;
  for(let i=0;i<count&&i<20000&&off+46<u.length;i++){
   if(dv.getUint32(off,true)!==0x02014b50)break;
   const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),usize=dv.getUint32(off+24,true),nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),local=dv.getUint32(off+42,true);
   if(off+46+nl>u.length)break;const name=new TextDecoder().decode(u.slice(off+46,off+46+nl));entries.push({name,method,csize,usize,local});off+=46+nl+el+cl;
  }
  const names=entries.map(e=>e.name);if(!names.includes('AndroidManifest.xml'))findings.push('В архиве нет AndroidManifest.xml — файл может быть некорректным APK.');
  if(!names.some(n=>/^classes(?:\d+)?\.dex$/i.test(n)))findings.push('Не найден classes.dex — проверьте формат файла.');
  if(names.some(n=>/^assets\/.*\.(dex|jar|apk)$/i.test(n)))findings.push('В assets обнаружен вложенный исполняемый файл (DEX/JAR/APK). Это бывает и в легитимных приложениях.');
  if(names.filter(n=>/^classes(?:\d+)?\.dex$/i.test(n)).length>8)findings.push('В архиве необычно много DEX-файлов; проверьте источник и разработчика.');
  const rules=[['android.permission.REQUEST_INSTALL_PACKAGES','Запрашивается разрешение на установку других пакетов.'],['android.permission.SYSTEM_ALERT_WINDOW','Упоминается разрешение отображать окна поверх других приложений.'],['android.permission.READ_SMS','Упоминается доступ к SMS.'],['android.permission.RECEIVE_SMS','Упоминается получение SMS.'],['android.permission.SEND_SMS','Упоминается отправка SMS.'],['android.permission.READ_CALL_LOG','Упоминается чтение журнала звонков.'],['android.permission.BIND_ACCESSIBILITY_SERVICE','Упоминается служба специальных возможностей.'],['getdeviceid','Найдена строка getDeviceId.'],['dexclassloader','Найдена ссылка на DexClassLoader.'],['runtime.exec','Найдена строка Runtime.exec.'],['su -c','Найдена команда su -c.']];
  const seen=new Set();
  for(const en of entries){if(!(/AndroidManifest\.xml|^classes(?:\d+)?\.dex$/i.test(en.name)))continue;if(en.usize>24*1024*1024)continue;
   let data=null;try{const lo=en.local;if(dv.getUint32(lo,true)!==0x04034b50)continue;const nl=dv.getUint16(lo+26,true),el=dv.getUint16(lo+28,true),start=lo+30+nl+el,end=start+en.csize;if(end>u.length)continue;const payload=u.slice(start,end);if(en.method===0)data=payload;else if(en.method===8&&typeof DecompressionStream==='function'){const stream=new Blob([payload]).stream().pipeThrough(new DecompressionStream('deflate-raw'));data=new Uint8Array(await new Response(stream).arrayBuffer())}}catch(_){ }
   if(!data)continue;const txt=new TextDecoder('latin1').decode(data).toLowerCase();for(const [needle,desc]of rules){if(txt.includes(needle)&&!seen.has(needle)){seen.add(needle);findings.push(desc)}}
  }
  if(!names.includes('AndroidManifest.xml')||!names.some(n=>/^classes(?:\d+)?\.dex$/i.test(n)))findings.push('Не все основные элементы APK распознаны; результат может быть неполным.');
  if(findings.length>=3)level='high';else if(findings.length>0)level='review';
  apkScanState={name:file.name,sizeLabel:(file.size/1024/1024).toFixed(2)+' МБ',sha256:hash,level,findings,scope:'Браузерная эвристика: проверены ZIP-структура и только доступные несжатые/распакованные строки. Это не полноценная проверка на вредоносный код и не сертификат безопасности.',entries:entries.length};
 }catch(err){apkScanState={name:file.name,sizeLabel:(file.size/1024/1024).toFixed(2)+' МБ',sha256:hash,level:'high',findings:[err.message||'Не удалось прочитать APK'],scope:'Проверка не завершена; не устанавливайте файл, пока не проверите источник.'}}
 if(status)status.innerHTML=renderApkScanPanel();input.value='';
}

let cyberNewsCache=[];
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localCyberAnalysis(input){
 const x=String(input||'').slice(0,6000), low=x.toLowerCase(), findings=[];
 const rules=[
  [/(\b| )(otp|cvv|cvc|pin|парол[а-я]*|код из sms|одноразов[а-я]* код|sms код)(\b| )/i,'Запрашиваются секретные коды или платёжные данные'],
  [/(срочно|немедленно|zudlik bilan|darhol|urgent|last chance|последний шанс)/i,'Давление срочностью — частый приём социальной инженерии'],
  [/(переведите|переведи|оплатите|инвестируй|гарантированн[а-я]* доход|гарантирован[а-я]* прибыль|выиграли|победител[ья])/i,'Есть финансовое обещание или просьба о переводе денег'],
  [/(https?:\/\/|www\.|t\.me\/|bit\.ly|tinyurl|\.apk\b)/i,'Есть ссылка, сокращатель или упоминание APK — не открывайте до проверки'],
  [/(банк|карта|милици|полици|налогов|доставка|посылк|аккаунт заблокирован)/i,'Сообщение использует имя организации или угрозу блокировки — проверьте через официальный канал']
 ];
 for(const [r,msg] of rules) if(r.test(low)) findings.push(msg);
 const level=findings.length>=3?'Высокий':findings.length===2?'Средний':findings.length===1?'Средний':'Неопределённый';
 return {mode:'local',risk:level,summary:findings.length?'Найдены признаки, требующие проверки. Это эвристика, не доказательство мошенничества.':'Локальные правила не нашли явных признаков. Это НЕ означает, что сообщение безопасно.',findings,actions:['Не сообщайте PIN, CVV, пароль и одноразовые коды.','Не переходите по ссылке из сообщения; самостоятельно откройте официальный сайт или приложение.','Перепроверьте просьбу по независимому каналу.'],disclaimer:'Офлайн-эвристика ограничена и может ошибаться.'};
}
function togglePwVisibility(show){const e=document.getElementById('pwInput');if(e)e.type=show?'text':'password';}
function scorePassword(){const e=document.getElementById('pwInput'),g=document.getElementById('pwGauge'),l=document.getElementById('pwLabel'),a=document.getElementById('pwAdvice');if(!e||!g||!l||!a)return;const p=e.value;if(!p){g.style.width='0';l.textContent='Введите пароль';a.textContent='Используйте длинную уникальную фразу, не повторяйте пароли между сайтами.';return;}let score=0;if(p.length>=12)score+=30;else if(p.length>=8)score+=18;if(/[a-z]/.test(p))score+=12;if(/[A-Z]/.test(p))score+=12;if(/\d/.test(p))score+=12;if(/[^A-Za-z0-9]/.test(p))score+=14;if(p.length>=18)score+=15;if(/(.)\1{2,}/.test(p)||/1234|password|qwerty|admin|letmein/i.test(p))score-=25;score=Math.max(5,Math.min(100,score));g.style.width=score+'%';g.style.background=score<35?'var(--hi)':score<65?'var(--me)':'var(--lo)';l.textContent=score<35?'Слабый пароль':score<65?'Средний пароль':'Хороший по базовым правилам';a.textContent=score<35?'Увеличьте длину и избегайте очевидных слов, повторов и последовательностей.':score<65?'Сделайте пароль длиннее и более уникальным; не используйте личные сведения.':'Хорошая основа. Используйте его только для одного аккаунта и сохраните в менеджере паролей.';}

async function checkLiveUrl(){const input=document.getElementById('liveUrl'),status=document.getElementById('urlCheckStatus'),box=document.getElementById('urlCheckResult');if(!input||!input.value.trim()){toast('Вставьте ссылку');return;}const raw=input.value.trim();let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw)}catch(e){status.textContent='Не удалось распознать ссылку. Проверьте адрес.';return;}const host=u.hostname.toLowerCase(),findings=[];if(u.protocol!=='https:')findings.push('Используется HTTP без шифрования');if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host))findings.push('В адресе используется IP вместо обычного домена');if(host.includes('xn--'))findings.push('Домен содержит Punycode — проверьте похожие символы');if(host.split('.').length>4)findings.push('Необычно много поддоменов');if(/bit\.ly|tinyurl|t\.co|goo\.gl|cutt\.ly|rb\.gy/i.test(host))findings.push('Обнаружен сокращённый URL — конечный адрес скрыт');if(/login|verify|secure|bank|wallet|bonus|gift|prize|pay|account|support/i.test(host))findings.push('В домене есть слова, часто используемые в приманках; это не доказательство мошенничества');if(u.username||u.password)findings.push('Адрес содержит данные перед символом @ — возможная маскировка домена');const score=Math.min(95,findings.length*18+(u.protocol==='http:'?10:0));const risk=score>=55?'Высокий':score>=25?'Средний':'Неопределённый';status.textContent='Локальные правила применены. Сверяем с базой OpenPhish…';box.innerHTML=`<div class="card"><h2 style="color:${risk==='Высокий'?'#b91c1c':risk==='Средний'?'#b45309':'var(--tx)'}">Предварительный риск: ${risk} (${score}/100)</h2><p><b>Домен:</b> ${safeText(host)}</p>${findings.map(x=>`<p>⚠️ ${safeText(x)}</p>`).join('')||'<p>Локальные правила не нашли явных подозрительных признаков.</p>'}<p><b>Совет:</b> ${findings.length?'Не открывайте ссылку, пока не подтвердите отправителя и настоящий домен.':'Даже отсутствие признаков не доказывает безопасность сайта.'}</p><div class="row"><button class="btn" onclick="copyCheckedUrl()">📋 Копировать адрес</button><button class="btn" onclick="clearLiveCheck()">Очистить</button></div><p class="mu">Эвристика может ошибаться; сверка с OpenPhish выполняется через сервер и недоступна офлайн.</p></div>`;window.fsCheckedUrl=u.href;serverThreatCheck(u.href,status,box);}

async function renderThreatAnalytics(force=false){const box=document.getElementById('threatAnalytics');if(!box)return;try{const r=await fetch(getApiBase()+'/api/analytics'+(force?'?refresh=1':''),{headers:{Accept:'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.error||'API недоступен');const cats=Object.entries(d.categories||{}).sort((a,b)=>b[1]-a[1]);const sources=Object.entries(d.sources||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);const months=Object.entries(d.months||{}).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);box.innerHTML=`<div class="card"><b>Всего публикаций</b><div style="font-size:30px;font-weight:800">${Number(d.total)||0}</div></div><div class="card"><b>Важные публикации</b><div style="font-size:30px;font-weight:800;color:#dc2626">${Number(d.important)||0}</div></div><div class="card"><b>Категории</b>${cats.length?cats.map(([k,v])=>`<div class="region-row"><span>${safeText(k)}</span><b>${v}</b></div>`).join(''):'<p class="mu">Нет данных</p>'}</div><div class="card"><b>Источники</b>${sources.length?sources.map(([k,v])=>`<div class="region-row"><span>${safeText(k)}</span><b>${v}</b></div>`).join(''):'<p class="mu">Нет данных</p>'}</div><div class="card"><b>Публикации по месяцам</b>${months.length?months.map(([k,v])=>`<div class="region-row"><span>${safeText(k)}</span><b>${v}</b></div>`).join(''):'<p class="mu">Нет дат</p>'}</div><p class="mu">Обновлено: ${d.updatedAt?safeText(new Date(d.updatedAt).toLocaleString('ru-RU')):'нет данных'}. ${safeText(d.method||'')}</p>`;}catch(e){box.innerHTML=`<p class="status-note">Аналитика не загружена: ${safeText(e.message)}. Проверьте сервер и обновите источники.</p>`;}}

function normalizeRegionText(v){return String(v||'').toLocaleLowerCase('ru-RU').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘`]/g,"'").replace(/[^a-zа-я0-9]+/g,' ').trim();}
function threatItemsForRegion(region){const keys=region.keys.map(normalizeRegionText);return cyberNewsCache.filter(n=>{const t=normalizeRegionText(String(n.title||'')+' '+String(n.description||''));return keys.some(k=>k.length>3&&(` ${t} `).includes(` ${k} `));});}
function regionFromFeature(feature){const p=feature?.properties||{};const candidates=[p.name_ru,p.name,p.NAME_1,p.shapeName,p.NAME_2,p.admin1Name,p.region].filter(Boolean).map(normalizeRegionText);return threatRegionAliases.find(r=>{const keys=[r.name,...r.keys].map(normalizeRegionText);return candidates.some(raw=>keys.some(k=>raw===k||raw.includes(k)||k.includes(raw)));})||null;}
function threatMentionCount(region){return region?threatItemsForRegion(region).length:0;}
function threatStyle(feature){const region=regionFromFeature(feature),count=threatMentionCount(region),root=document.documentElement,dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);const max=Math.max(1,...threatRegionAliases.map(threatMentionCount));const ratio=count/max;const fill=count===0?(dark?'#19334a':'#dff4f0'):ratio>.75?'#ff1744':ratio>.45?'#ff3d5a':ratio>.2?'#e05252':'#9b394d';return {color:count?'#ff647c':(dark?'#39d9f2':'#168b83'),weight:count?1.8:1.3,opacity:1,fillColor:fill,fillOpacity:count?Math.min(.78,.36+ratio*.4):(dark?.24:.55)};}
function showThreatRegion(region){if(!region)return;const matches=threatItemsForRegion(region),title=document.getElementById('threatRegionTitle'),summary=document.getElementById('threatRegionSummary'),items=document.getElementById('threatRegionItems');if(!title||!summary||!items)return;title.textContent=region.name;summary.textContent=matches.length?`В сохранённой ленте найдено упоминаний региона: ${matches.length}. Это совпадения по тексту, а не подтверждённые инциденты. Последняя дата публикации: ${safeText(formatCyberNewsDate(matches.map(n=>n.date).filter(Boolean).sort().pop()))}.`:'В текущей сохранённой ленте нет явных упоминаний региона. Это не означает, что угроз нет.';items.innerHTML=matches.length?matches.map(n=>`<article class="card" style="padding:12px"><div class="mu">${safeText(n.source||'Источник не указан')} · ${safeText(formatCyberNewsDate(n.date))}</div><b>${safeText(n.title||'Публикация')}</b><p>${safeText(n.description||'Описание не предоставлено источником.')}</p><a href="${safeText(/^https:\/\//i.test(n.url||'')?n.url:'https://uzcert.uz/') }" target="_blank" rel="noopener noreferrer">Открыть первоисточник ↗</a></article>`).join(''):'<p class="muted">Нет публикаций с явным упоминанием региона в сохранённой ленте. Проверьте официальные источники отдельно.</p>';document.querySelectorAll('[data-region-name]').forEach(b=>b.classList.toggle('selected',b.dataset.regionName===region.name));}
function renderThreatRegionList(){const list=document.getElementById('threatRegionList');if(!list)return;list.innerHTML=threatRegionAliases.map((r,i)=>`<button type="button" class="region-chip" data-region-name="${safeText(r.name)}" onclick="showThreatRegion(threatRegionAliases[${i}]);if(threatGeoLayer){threatGeoLayer.eachLayer(l=>{if(regionFromFeature(l.feature)?.name==='${r.name.replace(/'/g,"\'")}')threatLeafletMap.fitBounds(l.getBounds(),{padding:[18,18],maxZoom:8})})}">${safeText(r.name)}</button>`).join('');}

async function fetchRegionGeoJSON(){try{const cached=localStorage.getItem(THREAT_GEO_CACHE);if(cached){const j=JSON.parse(cached);if(j&&Array.isArray(j.features)&&j.features.length)return {data:j,cached:true};}}catch(e){}const urls=[getApiBase()+'/api/regions','https://raw.githubusercontent.com/akbartus/GeoJSON-Uzbekistan/main/geojson/uzbekistan_regional.geojson','https://raw.githubusercontent.com/negeloT/uzbekistan_borders/main/GEOJSON_LVL/uzbekistan_lvl2.geojson'];for(const url of urls){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);const r=await fetch(url,{signal:controller.signal,cache:'no-cache'});clearTimeout(timer);if(!r.ok)continue;const j=await r.json();if(j&&Array.isArray(j.features)&&j.features.length>=10){try{const packed=JSON.stringify(j);if(packed.length<3500000)localStorage.setItem(THREAT_GEO_CACHE,packed);}catch(e){}return {data:j,cached:false};}}catch(e){}}return null;}
function renderMapNewsFeed(){const box=document.getElementById('threatRegionItems');if(!box)return;const selected=document.getElementById('threatRegionTitle')?.textContent||'';if(threatRegionAliases.some(r=>r.name===selected))return;const items=cyberNewsCache.slice().sort((a,b)=>Date.parse(b.date||0)-Date.parse(a.date||0)).slice(0,8);box.innerHTML=`<div class="map-feed-title"><b>Последние публикации</b><span class="local-pill">${items.length} шт.</span></div><p class="muted">Лента из RSS-источников. Красный цвет региона отражает только текстовые упоминания, а не подтверждённое число атак.</p>`+(items.length?items.map(n=>`<article class="map-feed-item"><div class="mu">${safeText(n.source||'Источник')} · ${safeText(formatCyberNewsDate(n.date))}${n.important?' · 🔴 Важное':''}</div><b class="map-feed-headline">${safeText(n.title||'Публикация')}</b><div><a class="news-source-link" href="${safeText(/^https:\/\//i.test(n.url||'')?n.url:'https://uzcert.uz/')}" target="_blank" rel="noopener noreferrer">Первоисточник ↗</a></div><p>${safeText((n.description||'').slice(0,220))}</p></article>`).join(''):'<p class="muted">Новости не загружены. Настройте адрес API-сервера в разделе «Антивирус (бета)» или подключите интернет и обновите источники.</p>');}
async function refreshMapNews(){try{const r=await fetch(getApiBase()+'/api/news',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(Array.isArray(d.items)){cyberNewsCache=d.items;try{sv('fs_offline_news',{items:cyberNewsCache.slice(0,100),updatedAt:d.updatedAt||new Date().toISOString()})}catch(e){}renderMapNewsFeed();if(threatGeoLayer)threatGeoLayer.setStyle(threatStyle);const status=document.getElementById('mapLoadStatus');if(status){const ok=(d.sources||[]).filter(x=>x.ok).length,failed=(d.sources||[]).filter(x=>!x.ok).length;status.textContent=`Границы и новости загружаются через интернет. RSS-источники доступны: ${ok}; с ошибками: ${failed}. Обновлено: ${d.updatedAt?new Date(d.updatedAt).toLocaleString('ru-RU'):'дата неизвестна'}. Публикации не подтверждают географию атаки.`}}}catch(e){const status=document.getElementById('mapLoadStatus');if(status)status.textContent='Не удалось обновить новостную ленту с сервера. Показаны только сохранённые публикации, если они есть. '+e.message;}}
async function initThreatMap(){const el=document.getElementById('threatMap');if(!el)return;renderThreatRegionList();if(!cyberNewsCache.length){const c=ld('fs_offline_news',{});cyberNewsCache=Array.isArray(c.items)?c.items:[];}const status=document.getElementById('mapLoadStatus'),pill=document.getElementById('mapModePill');if(threatLeafletMap){setTimeout(()=>threatLeafletMap.invalidateSize(),60);return;}if(threatMapLoadPromise)return threatMapLoadPromise;threatMapLoadPromise=(async()=>{const result=await fetchRegionGeoJSON();if(!result){if(pill)pill.textContent='Офлайн-режим';if(status)status.textContent='Не удалось загрузить границы регионов. Список регионов остаётся доступным; карта появится после подключения к интернету и повторного открытия раздела.';el.innerHTML='<div class="map-empty"><b>Геометрия карты пока недоступна.</b><p>Выберите регион в списке справа. Приложение не будет показывать выдуманные границы или данные об атаках.</p></div>';return;}threatGeoData=result.data;if(typeof L==='undefined'){if(pill)pill.textContent='Список регионов';if(status)status.textContent='Библиотека интерактивной карты не загрузилась. Геометрия получена, но карта не может отобразиться. Список регионов доступен ниже.';el.innerHTML='<div class="map-empty">Для интерактивной карты требуется загрузить Leaflet. Вы можете выбрать регион из списка.</div>';return;}el.innerHTML='';threatLeafletMap=L.map(el,{scrollWheelZoom:false,preferCanvas:true}).setView([41.3,64.5],5);threatLeafletMap.setMaxBounds([[36.5,55.5],[46.0,74.5]]);const PROVIDERS=[
 {n:'OpenStreetMap',u:()=>'https://tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>'}},
 {n:'CARTO',u:d=>'https://{s}.basemaps.cartocdn.com/'+(d?'dark_all':'light_all')+'/{z}/{x}/{y}{r}.png',o:{subdomains:'abcd',className:'fs-carto-tile',maxZoom:20,attribution:'© OpenStreetMap contributors © CARTO'}},
 {n:'OpenStreetMap DE',u:()=>'https://tile.openstreetmap.de/{z}/{x}/{y}.png',o:{maxZoom:18,attribution:'© OpenStreetMap contributors'}},
 {n:'Esri',u:()=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',o:{maxZoom:18,attribution:'Tiles © Esri'}}
];
let tiles=null,pi=-1;
const mapDark=()=>document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
function useProvider(i){
 if(tiles){try{threatLeafletMap.removeLayer(tiles)}catch(e){}tiles=null}
 if(i>=PROVIDERS.length){pi=-1;if(status)status.textContent='Картографическая подложка недоступна (возможно, заблокирована сетью). Границы областей и новости работают без неё.';return}
 pi=i;const p=PROVIDERS[i];let ok=0,bad=0;
 const layer=L.tileLayer(p.u(mapDark()),{minZoom:4,keepBuffer:3,updateWhenIdle:true,...p.o});
 layer.on('tileload',()=>{ok++});
 layer.on('tileerror',()=>{bad++;if(!ok&&bad>=4&&tiles===layer){if(status)status.textContent='Подложка '+p.n+' недоступна, пробуем '+(PROVIDERS[i+1]?PROVIDERS[i+1].n:'следующую')+'…';useProvider(i+1)}});
 layer.addTo(threatLeafletMap);tiles=layer;
}
useProvider(0);
window.fsRefreshMapTheme=()=>{if(pi===1)useProvider(1)};threatGeoLayer=L.geoJSON(threatGeoData,{style:threatStyle,onEachFeature:(f,layer)=>{const region=regionFromFeature(f),raw=String(f.properties?.name_ru||f.properties?.name||f.properties?.NAME_1||f.properties?.shapeName||'Регион');layer.bindTooltip(region?region.name:raw);layer.on('mouseover',()=>layer.setStyle({weight:2.2,fillOpacity:.58}));layer.on('mouseout',()=>threatGeoLayer.resetStyle(layer));layer.on('click',()=>{if(region)showThreatRegion(region);else{const t=document.getElementById('threatRegionTitle');const s=document.getElementById('threatRegionSummary');if(t)t.textContent=raw;if(s)s.textContent='Не удалось сопоставить название объекта с локальным справочником регионов. Данные об угрозах не выводятся.';}});}}).addTo(threatLeafletMap);threatLeafletMap.fitBounds(threatGeoLayer.getBounds(),{padding:[8,8]});threatLeafletMap.whenReady(()=>setTimeout(()=>threatLeafletMap.invalidateSize({pan:false}),250));window.addEventListener('resize',()=>threatLeafletMap&&threatLeafletMap.invalidateSize({pan:false}));renderMapNewsFeed();threatGeoLayer.setStyle(threatStyle);setTimeout(()=>threatLeafletMap.invalidateSize(),120);if(pill)pill.textContent=result.cached?'Границы из кеша':'Карта загружена';if(status)status.textContent=result.cached?'Границы регионов загружены из кеша этого устройства. Подложка OpenStreetMap требует интернет.':'Границы регионов загружены из открытого GeoJSON-источника и сохранены в локальный кеш. Подложка OpenStreetMap требует интернет.';})().finally(()=>{threatMapLoadPromise=null;});return threatMapLoadPromise;}
const oldGo=go;
go=function(v){oldGo(v);if(v==='ai'){const input=document.getElementById('apiBase');try{if(input)input.value=localStorage.getItem('fs_api_base')||''}catch(e){}refreshThreatStatus()}if(v==='news'){const cb=document.getElementById('newsNotify');try{if(cb)cb.checked=localStorage.getItem('fs_news_notify')==='1'}catch(e){}loadCyberNews(false)}if(v==='threatmap'){if(!cyberNewsCache.length){const c=ld('fs_offline_news',{});cyberNewsCache=Array.isArray(c.items)?c.items:[]}setTimeout(async()=>{await refreshMapNews();await initThreatMap();},120)}};
setInterval(()=>{if(view==='news')loadCyberNews(false)},10*60*1000);

function selectFsRegion(btn,name){document.querySelectorAll('.region-chip').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const t=document.getElementById('fsRegionTitle');if(t)t.textContent=name;}
function render(quiet){document.documentElement.lang=lang;document.documentElement.style.fontSize=big?'19px':'';
 $('.sb').classList.toggle('col',col_);
 $('#nav').innerHTML=NAV.map(([k,e,l])=>`<button class="nv ${view===k||(view==='result'&&k==='check')?'on':''}" onclick="go('${k}')"><span class="e">${e}</span><span class="lb">${t(l)}</span></button>`).join('');
 $('#bg').classList.toggle('on',big);
 $('#app').className=quiet?'':'view';$('#app').innerHTML=V[view]();if(view==='antivirus')refreshApkThreatDatabaseStatus();post(quiet)}
render();
